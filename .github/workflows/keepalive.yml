# GitHub pauses scheduled workflows in a public repository after 60 days without any repository
# activity. The page itself is published without commits, so a quiet repository would silently stop
# updating. Once a month this job checks the last commit and, if it is 30+ days old, pushes an empty
# commit. (Commits made with GITHUB_TOKEN do not trigger other workflows, so no extra build runs.)
name: Keep schedules alive

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Empty commit if the repository has been quiet for 30 days
        run: |
          last=$(git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Last commit: ${age_days} days ago"
          if [ "$age_days" -ge 30 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep scheduled updates active (GitHub pauses them after 60 quiet days)"
            git push
          else
            echo "Recent activity, nothing to do."
          fi
