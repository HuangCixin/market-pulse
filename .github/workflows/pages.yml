# Builds Market Pulse with real market data and publishes it to GitHub Pages.
#   - weekdays every 30 minutes from 00:07 to 21:37 UTC (Asia open → US close): intraday pages
#   - weekdays 22:37 UTC, after the US close: the day's closing page
#   - weekends every 3 hours (only crypto trades; live crypto prices also update in the browser)
#   - on every push to main, and on demand (Actions → Daily update → Run workflow)
# Minutes 7/37 avoid the top of the hour, when GitHub delays scheduled runs the most; a run can
# still start a few minutes late. Bars of markets still trading are marked as unfinished
# (market/sessions.py) and kept out of correlations.
# The site has:  index.html (latest real data), demo.html (synthetic data), summary.json
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Daily update

on:
  schedule:
    - cron: "7,37 0-21 * * 1-5"
    - cron: "37 22 * * 1-5"
    - cron: "7 */3 * * 0,6"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # If the download fails the job stops here and the previous page stays online.
      - name: Build the page (real data)
        run: |
          python run_daily.py
          latest=$(ls -d reports/*/ | grep -v -- '-demo/' | sort | tail -1)
          mkdir -p site
          cp "${latest}report.html" site/index.html
          cp "${latest}summary.json" site/summary.json

      - name: Build the demo page (synthetic data)
        run: |
          python run_daily.py --demo
          cp reports/*-demo/report.html site/demo.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
